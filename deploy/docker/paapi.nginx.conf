# 现有公网入口需将 paapi.lylab.vip 转发到本服务器的 8888，TLS 由该入口处理。
server {
    listen 8888;
    server_name paapi.lylab.vip;
    client_max_body_size 20m;

    # 每次更新后端容器 IP 后通过 Docker DNS 重新解析，避免 Nginx 保留旧上游地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pa_backend personal-assistant-api:20000;

    location /api/ {
        proxy_pass http://$pa_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
