server {
    listen 80;
    listen [::]:80;
    server_name lylab.vip person.lylab.vip;

    location /api/ {
        proxy_pass http://192.168.31.5:16101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://192.168.31.6:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vue Router history mode fallback.
        proxy_intercept_errors on;
        # Use an internal redirect instead of a named location: nginx forbids
        # proxy_pass URI parts (such as /index.html) inside named locations.
        error_page 404 = /index.html;
    }
}
